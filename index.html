<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Trading Terminal - Señales Supertrend & VSA</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; 
            background-color: #0d1117; 
            color: #d1d4dc; 
            display: flex; 
            flex-direction: column; 
        }

        #top-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 4px 12px; 
            background-color: #161b22; 
            border-bottom: 1px solid #21262d; 
            flex-shrink: 0; 
            min-height: 42px;
            width: 100%;
            overflow-x: auto;
        }

        .controls-group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
        label { font-size: 11px; color: #8b949e; }
        select, button { 
            background-color: #21262d; 
            color: #c9d1d9; 
            border: 1px solid #30363d; 
            padding: 3px 7px; 
            border-radius: 4px; 
            font-size: 11px; 
            cursor: pointer; 
            transition: all 0.2s; 
            white-space: nowrap;
        }
        select:hover, button:hover { background-color: #30363d; }
        button.active { background-color: #238636; color: #ffffff; border-color: #2ea043; }
        button.inactive { opacity: 0.5; background-color: #161b22; color: #8b949e; }
        #status { font-size: 11px; color: #58a6ff; font-weight: bold; }

        #main-container { 
            display: flex; 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            width: 100%; 
            height: calc(100vh - 42px); 
        }

        #chart-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            min-width: 0;
            min-height: 0;
        }

        #chart { width: 100%; height: 100%; }

        #labels-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #dashboard { 
            width: 260px; 
            min-width: 260px;
            height: 100%;
            background-color: #161b22; 
            border-left: 1px solid #21262d; 
            padding: 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            overflow-y: auto; 
            flex-shrink: 0; 
        }

        #dashboard::-webkit-scrollbar { width: 4px; }
        #dashboard::-webkit-scrollbar-track { background: #0d1117; }
        #dashboard::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

        .dash-module { 
            background-color: #0d1117; 
            border-radius: 6px; 
            padding: 6px 8px; 
            border: 1px solid #21262d; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            flex-shrink: 0;
            width: 100%;
        }
        .dash-module h4 { 
            font-size: 10px; 
            color: #8b949e; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            margin-bottom: 2px;
        }
        .dash-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 10px; 
            align-items: center; 
            gap: 4px;
        }
        .dash-val { font-weight: bold; text-align: right; }

        .vsa-table { width: 100%; border-collapse: collapse; font-size: 9px; margin-top: 2px; }
        .vsa-table th { text-align: left; color: #8b949e; padding: 2px 0; font-weight: normal; border-bottom: 1px solid #21262d; }
        .vsa-table td { padding: 2px 0; text-align: right; }
        .vsa-table td:first-child { text-align: left; font-weight: bold; }

        .badge-buy { background-color: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; padding: 1px 3px; border-radius: 2px; font-size: 8px; font-weight: bold; }
        .badge-sell { background-color: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #f85149; padding: 1px 3px; border-radius: 2px; font-size: 8px; font-weight: bold; }
        .badge-neu { background-color: rgba(139, 148, 158, 0.2); color: #8b949e; border: 1px solid #8b949e; padding: 1px 3px; border-radius: 2px; font-size: 8px; font-weight: bold; }
        
        .txt-buy { color: #3fb950; font-weight: bold; }
        .txt-sell { color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="controls-group">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1m">1 Min</option>
                <option value="5m">5 Min</option>
                <option value="15m" selected>15 Min</option>
                <option value="1h">1 Hour</option>
                <option value="4h">4 Hours</option>
                <option value="1d">1 Day</option>
            </select>
            <div id="status">Conectando...</div>
        </div>

        <div class="controls-group">
            <button id="toggle-supertrend" class="active">Señales Supertrend</button>
            <button id="toggle-vsa" class="active">S/R Ballenas VSA</button>
        </div>
    </div>

    <div id="main-container">
        <div id="chart-wrapper">
            <div id="chart"></div>
            <canvas id="labels-overlay"></canvas>
        </div>

        <div id="dashboard">
            <div id="dash-module-supertrend" class="dash-module" style="border-color: #58a6ff;">
                <h4>Supertrend (10, 3)</h4>
                <div class="dash-row"><span>Estado:</span><span id="dash-st-signal" class="dash-val">--</span></div>
                <div class="dash-row"><span>Valor ST:</span><span id="dash-st-price" class="dash-val">--</span></div>
            </div>

            <div id="dash-module-vsa" class="dash-module">
                <h4>Matriz VSA Ballenas MTF</h4>
                <table class="vsa-table">
                    <thead>
                        <tr><th>TF</th><th>Señal</th><th>Vol</th><th>%C</th><th>%V</th></tr>
                    </thead>
                    <tbody id="vsa-mtf-tbody">
                        <tr id="row-5m"><td>5M</td><td><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-15m"><td>15M</td><td><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-1h"><td>1H</td><td><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-4h"><td>4H</td><td><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-1d"><td>1D</td><td><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let currentCandleData = [];
        let vsaLinesToDraw = [];
        let calculatedMarkers = [];
        let wsConnection = null;

        let showSupertrend = true;
        let showVsa = true;

        const statusEl = document.getElementById("status");
        const timeframeSelect = document.getElementById("timeframe");
        const chartContainer = document.getElementById("chart");
        const overlay = document.getElementById("labels-overlay");
        const ctx = overlay.getContext("2d");

        // Inicializar Gráfico
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
            timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false, rightOffset: 12 },
            rightPriceScale: { borderColor: '#30363d', autoScale: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#238636', downColor: '#da3633', borderVisible: false, wickUpColor: '#238636', wickDownColor: '#da3633'
        });

        function resizeCanvas() {
            overlay.width = chartContainer.clientWidth;
            overlay.height = chartContainer.clientHeight;
            drawOverlay();
        }

        const resizeObserver = new ResizeObserver(entries => {
            if (!entries || entries.length === 0) return;
            const { width, height } = entries[0].contentRect;
            chart.applyOptions({ width, height });
            resizeCanvas();
        });
        resizeObserver.observe(chartContainer);
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => drawOverlay());

        // Algoritmo Supertrend (Solo calcula las señales)
        function calculateSupertrend(data, period = 10, multiplier = 3.0) {
            if (!data || data.length < period) return { signals: [] };

            let tr = [];
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    tr.push(data[i].high - data[i].low);
                } else {
                    const hl = data[i].high - data[i].low;
                    const hpc = Math.abs(data[i].high - data[i - 1].close);
                    const lpc = Math.abs(data[i].low - data[i - 1].close);
                    tr.push(Math.max(hl, hpc, lpc));
                }
            }

            let atr = new Array(data.length).fill(0);
            let sumTR = 0;
            for (let i = 0; i < period; i++) sumTR += tr[i];
            atr[period - 1] = sumTR / period;

            for (let i = period; i < data.length; i++) {
                atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
            }

            let upperBand = new Array(data.length).fill(0);
            let lowerBand = new Array(data.length).fill(0);
            let superTrend = new Array(data.length).fill(0);
            let trend = new Array(data.length).fill(1);

            let signals = [];

            for (let i = period - 1; i < data.length; i++) {
                const hl2 = (data[i].high + data[i].low) / 2;
                const basicUpper = hl2 + (multiplier * atr[i]);
                const basicLower = hl2 - (multiplier * atr[i]);

                if (i === period - 1) {
                    upperBand[i] = basicUpper;
                    lowerBand[i] = basicLower;
                    superTrend[i] = basicLower;
                    trend[i] = 1;
                } else {
                    lowerBand[i] = (basicLower > lowerBand[i - 1] || data[i - 1].close < lowerBand[i - 1]) ? basicLower : lowerBand[i - 1];
                    upperBand[i] = (basicUpper < upperBand[i - 1] || data[i - 1].close > upperBand[i - 1]) ? basicUpper : upperBand[i - 1];

                    if (trend[i - 1] === 1) {
                        trend[i] = data[i].close < lowerBand[i] ? -1 : 1;
                    } else {
                        trend[i] = data[i].close > upperBand[i] ? 1 : -1;
                    }

                    superTrend[i] = trend[i] === 1 ? lowerBand[i] : upperBand[i];

                    if (trend[i] !== trend[i - 1]) {
                        signals.push({
                            time: data[i].time,
                            type: trend[i] === 1 ? 'ST_BUY' : 'ST_SELL',
                            price: superTrend[i]
                        });
                    }
                }
            }

            return { signals, currentTrend: trend[trend.length - 1], lastValue: superTrend[superTrend.length - 1] };
        }

        // VSA Analysis
        function analyzeVSAData(candles, period = 20, factor = 1.8) {
            if (!candles || candles.length < period + 1) return { events: [], lastSupport: null, lastResistance: null };
            let events = [], lastSupport = null, lastResistance = null;

            for (let i = period; i < candles.length; i++) {
                let sumVol = 0;
                for (let j = i - period; j < i; j++) sumVol += candles[j].volume;
                const avgVol = sumVol / period;
                const candle = candles[i];
                const range = candle.high - candle.low;
                const effVol = candle.volume || 1.0;
                const isWhale = effVol > (avgVol * factor);

                const volBuy = range === 0 ? effVol / 2 : effVol * ((candle.close - candle.low) / range);
                const volSell = effVol - volBuy;
                const deltaNet = volBuy - volSell;

                const mInf = Math.min(candle.open, candle.close) - candle.low;
                const mSup = candle.high - Math.max(candle.open, candle.close);

                const isBuy = isWhale && (deltaNet > 0 || mInf > (range * 0.35));
                const isSell = isWhale && (deltaNet < 0 || mSup > (range * 0.35));

                if (isBuy) {
                    const ev = { index: i, time: candle.time, type: 'BUY', price: candle.low };
                    events.push(ev);
                    lastSupport = ev;
                } else if (isSell) {
                    const ev = { index: i, time: candle.time, type: 'SELL', price: candle.high };
                    events.push(ev);
                    lastResistance = ev;
                }
            }
            return { events, lastSupport, lastResistance };
        }

        function drawOverlay() {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (!showVsa || vsaLinesToDraw.length === 0 || currentCandleData.length === 0) return;

            const timeScale = chart.timeScale();
            const lastCandle = currentCandleData[currentCandleData.length - 1];
            let lastCandleX = timeScale.timeToCoordinate(lastCandle.time) || (overlay.width - 65);

            vsaLinesToDraw.forEach(item => {
                const y = candlestickSeries.priceToCoordinate(item.price);
                if (y !== null && y >= 0 && y <= overlay.height) {
                    let startX = item.startTime ? Math.max(0, timeScale.timeToCoordinate(item.startTime) || 0) : 0;
                    ctx.strokeStyle = item.color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(startX, y);
                    ctx.lineTo(lastCandleX, y);
                    ctx.stroke();

                    ctx.font = "bold 9px sans-serif";
                    const rectW = ctx.measureText(item.title).width + 8;
                    ctx.fillStyle = item.color;
                    ctx.fillRect(lastCandleX + 5, y - 7, rectW, 14);
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(item.title, lastCandleX + 5 + (rectW / 2), y);
                }
            });
        }

        async function fetchKlines(interval, limit = 300) {
            const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;
            const res = await fetch(url);
            const data = await res.json();
            return data.map(d => ({
                time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
            }));
        }

        async function processIndicators() {
            if (!currentCandleData || currentCandleData.length === 0) return;
            vsaLinesToDraw = [];
            let allMarkers = [];

            // 1. Supertrend (Solo marcadores/señales)
            if (showSupertrend) {
                const st = calculateSupertrend(currentCandleData, 10, 3.0);

                st.signals.forEach(sig => {
                    allMarkers.push({
                        time: sig.time,
                        position: sig.type === 'ST_BUY' ? 'belowBar' : 'aboveBar',
                        color: sig.type === 'ST_BUY' ? '#2ea043' : '#f85149',
                        shape: sig.type === 'ST_BUY' ? 'arrowUp' : 'arrowDown',
                        text: sig.type === 'ST_BUY' ? 'ST BUY' : 'ST SELL'
                    });
                });

                document.getElementById("dash-st-signal").innerText = st.currentTrend === 1 ? "ALCISTA 🚀" : "BAJISTA 🐻";
                document.getElementById("dash-st-signal").style.color = st.currentTrend === 1 ? "#3fb950" : "#f85149";
                document.getElementById("dash-st-price").innerText = `$${st.lastValue ? st.lastValue.toFixed(2) : '--'}`;
            }

            // 2. VSA
            if (showVsa) {
                const { events, lastSupport, lastResistance } = analyzeVSAData(currentCandleData);
                events.forEach(e => {
                    allMarkers.push({
                        time: e.time, position: e.type === 'BUY' ? 'belowBar' : 'aboveBar',
                        color: e.type === 'BUY' ? '#3fb950' : '#f85149', shape: 'circle', text: 'VSA'
                    });
                });

                if (lastSupport) vsaLinesToDraw.push({ price: lastSupport.price, color: '#2ea043', title: 'Sop VSA', startTime: lastSupport.time });
                if (lastResistance) vsaLinesToDraw.push({ price: lastResistance.price, color: '#f85149', title: 'Res VSA', startTime: lastResistance.time });
            }

            calculatedMarkers = allMarkers.sort((a, b) => a.time - b.time);
            candlestickSeries.setMarkers(calculatedMarkers);
            drawOverlay();
        }

        function connectWebSocket(interval) {
            if (wsConnection) wsConnection.close();
            wsConnection = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);

            wsConnection.onopen = () => { statusEl.style.display = "none"; };
            wsConnection.onmessage = (event) => {
                const k = JSON.parse(event.data).k;
                const candle = { time: Math.floor(k.t / 1000), open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v) };
                
                candlestickSeries.update(candle);
                if (currentCandleData.length > 0) {
                    if (currentCandleData[currentCandleData.length - 1].time === candle.time) {
                        currentCandleData[currentCandleData.length - 1] = candle;
                    } else {
                        currentCandleData.push(candle);
                        if (currentCandleData.length > 500) currentCandleData.shift();
                    }
                }
                processIndicators();
            };
        }

        async function renderChart() {
            statusEl.style.display = "block";
            statusEl.innerText = "Cargando...";
            const selectedTF = timeframeSelect.value;
            
            currentCandleData = await fetchKlines(selectedTF, 300);
            candlestickSeries.setData(currentCandleData);
            await processIndicators();
            connectWebSocket(selectedTF);
        }

        // Eventos
        timeframeSelect.addEventListener('change', renderChart);
        
        document.getElementById("toggle-supertrend").addEventListener('click', function() {
            showSupertrend = !showSupertrend;
            this.classList.toggle('active', showSupertrend);
            this.classList.toggle('inactive', !showSupertrend);
            processIndicators();
        });

        document.getElementById("toggle-vsa").addEventListener('click', function() {
            showVsa = !showVsa;
            this.classList.toggle('active', showVsa);
            this.classList.toggle('inactive', !showVsa);
            processIndicators();
        });

        renderChart();
    });
    </script>
</body>
</html>
