<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Trading Terminal - VSA MTF & Supertrend</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; 
            background-color: #0b0e14; 
            color: #d1d4dc; 
            display: flex; 
            flex-direction: column; 
        }

        #top-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 4px 12px; 
            background-color: #12161f; 
            border-bottom: 1px solid #1e2330; 
            flex-shrink: 0; 
            min-height: 42px;
            width: 100%;
        }

        .controls-group { display: flex; align-items: center; gap: 6px; }
        label { font-size: 11px; color: #8b949e; }
        select, button { 
            background-color: #1e2330; 
            color: #c9d1d9; 
            border: 1px solid #2d3446; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        select:hover, button:hover { background-color: #2d3446; }
        button.active { background-color: #1f6feb; color: #ffffff; border-color: #388bfd; }
        button.inactive { opacity: 0.5; background-color: #12161f; color: #8b949e; }
        
        .status-badge {
            background-color: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid #2ea043;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }

        #main-container { 
            display: flex; 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            width: 100%; 
            height: calc(100vh - 42px); 
        }

        #chart-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            min-width: 0;
            min-height: 0;
        }

        #chart { width: 100%; height: 100%; }

        #labels-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #dashboard { 
            width: 290px; 
            min-width: 290px;
            height: 100%;
            background-color: #12161f; 
            border-left: 1px solid #1e2330; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            overflow-y: auto; 
            transition: margin-right 0.3s ease, width 0.3s ease;
        }

        #dashboard.collapsed {
            display: none;
        }

        .dash-module { 
            background-color: #0b0e14; 
            border-radius: 6px; 
            padding: 8px; 
            border: 1px solid #1e2330; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        .dash-module h4 { 
            font-size: 10px; 
            color: #8b949e; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            margin-bottom: 4px;
        }
        .dash-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 11px; 
            align-items: center; 
        }
        .dash-val { font-weight: bold; }

        .vsa-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
        .vsa-table th { text-align: left; color: #58a6ff; padding: 4px 0; font-weight: bold; border-bottom: 1px solid #1e2330; }
        .vsa-table td { padding: 4px 0; text-align: right; }
        .vsa-table td:first-child { text-align: left; font-weight: bold; color: #c9d1d9; }

        .badge-buy { background-color: #2ea043; color: #ffffff; padding: 1px 4px; border-radius: 2px; font-size: 9px; font-weight: bold; }
        .badge-sell { background-color: #f85149; color: #ffffff; padding: 1px 4px; border-radius: 2px; font-size: 9px; font-weight: bold; }
        .badge-neu { background-color: #30363d; color: #8b949e; padding: 1px 4px; border-radius: 2px; font-size: 9px; font-weight: bold; }
        
        .txt-buy { color: #3fb950; font-weight: bold; }
        .txt-sell { color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="controls-group">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1m">1 Minuto</option>
                <option value="5m">5 Minutos</option>
                <option value="15m" selected>15 Minutos</option>
                <option value="1h">1 Hora</option>
                <option value="4h">4 Horas</option>
                <option value="1d">1 Diario</option>
            </select>
            <span class="status-badge">Conectado ✓</span>
        </div>

        <div class="controls-group">
            <button id="toggle-vsa" class="active">S/R Ballenas VSA</button>
            <button id="toggle-supertrend" class="active">Señales BUY/SELL</button>
            <button id="toggle-dash" class="active">Dashboard MTF</button>
        </div>
    </div>

    <div id="main-container">
        <div id="chart-wrapper">
            <div id="chart"></div>
            <canvas id="labels-overlay"></canvas>
        </div>

        <div id="dashboard">
            <div id="dash-module-vsa" class="dash-module">
                <table class="vsa-table">
                    <thead>
                        <tr><th>Timeframe</th><th>Señal VSA</th><th>Vol. Transado</th><th>% Compra</th><th>% Venta</th></tr>
                    </thead>
                    <tbody id="vsa-mtf-tbody">
                        <tr id="row-5m"><td>5 Minutos</td><td><span id="badge-5m" class="badge-neu">--</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-15m"><td>15 Minutos</td><td><span id="badge-15m" class="badge-neu">--</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-1h"><td>1 Hora</td><td><span id="badge-1h" class="badge-neu">--</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-4h"><td>4 Horas</td><td><span id="badge-4h" class="badge-neu">--</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                        <tr id="row-1d"><td>1 Diario</td><td><span id="badge-1d" class="badge-neu">--</span></td><td>--</td><td class="txt-buy">--</td><td class="txt-sell">--</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="dash-module">
                <h4>CONFIGURACIÓN VSA</h4>
                <div class="dash-row"><span>Periodo Prom. Vol:</span><span class="dash-val">20</span></div>
                <div class="dash-row"><span>Mult. Vol Ballena:</span><span class="dash-val">1.8</span></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let currentCandleData = [];
        let vsaLinesToDraw = [];
        let wsConnection = null;

        let showSupertrend = true;
        let showVsa = true;
        let showDash = true;

        const timeframeSelect = document.getElementById("timeframe");
        const chartContainer = document.getElementById("chart");
        const overlay = document.getElementById("labels-overlay");
        const dashboard = document.getElementById("dashboard");
        const ctx = overlay.getContext("2d");

        const mtfTimeframes = [
            { tf: '5m', label: '5m', colorRes: '#ff3b30', colorSop: '#007aff', dash: [3, 3] },
            { tf: '15m', label: '15m', colorRes: '#ff3b30', colorSop: '#007aff', dash: [3, 3] },
            { tf: '1h', label: '1H', colorRes: '#ff3b30', colorSop: '#007aff', dash: [] },
            { tf: '4h', label: '4H', colorRes: '#bf5af2', colorSop: '#bf5af2', dash: [] },
            { tf: '1d', label: '1D', colorRes: '#ff9500', colorSop: '#ff9500', dash: [] }
        ];

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { background: { type: 'solid', color: '#0b0e14' }, textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            timeScale: { borderColor: '#1e2330', timeVisible: true, secondsVisible: false, rightOffset: 12 },
            rightPriceScale: { borderColor: '#1e2330', autoScale: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        function resizeCanvas() {
            overlay.width = chartContainer.clientWidth;
            overlay.height = chartContainer.clientHeight;
            drawOverlay();
        }

        const resizeObserver = new ResizeObserver(entries => {
            if (!entries || entries.length === 0) return;
            const { width, height } = entries[0].contentRect;
            chart.applyOptions({ width, height });
            resizeCanvas();
        });
        resizeObserver.observe(chartContainer);
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => drawOverlay());

        function calculateSupertrend(data, period = 10, multiplier = 3.0) {
            if (!data || data.length < period) return { signals: [] };

            let tr = [];
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    tr.push(data[i].high - data[i].low);
                } else {
                    const hl = data[i].high - data[i].low;
                    const hpc = Math.abs(data[i].high - data[i - 1].close);
                    const lpc = Math.abs(data[i].low - data[i - 1].close);
                    tr.push(Math.max(hl, hpc, lpc));
                }
            }

            let atr = new Array(data.length).fill(0);
            let sumTR = 0;
            for (let i = 0; i < period; i++) sumTR += tr[i];
            atr[period - 1] = sumTR / period;

            for (let i = period; i < data.length; i++) {
                atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
            }

            let upperBand = new Array(data.length).fill(0);
            let lowerBand = new Array(data.length).fill(0);
            let superTrend = new Array(data.length).fill(0);
            let trend = new Array(data.length).fill(1);
            let signals = [];

            for (let i = period - 1; i < data.length; i++) {
                const hl2 = (data[i].high + data[i].low) / 2;
                const basicUpper = hl2 + (multiplier * atr[i]);
                const basicLower = hl2 - (multiplier * atr[i]);

                if (i === period - 1) {
                    upperBand[i] = basicUpper;
                    lowerBand[i] = basicLower;
                    superTrend[i] = basicLower;
                    trend[i] = 1;
                } else {
                    lowerBand[i] = (basicLower > lowerBand[i - 1] || data[i - 1].close < lowerBand[i - 1]) ? basicLower : lowerBand[i - 1];
                    upperBand[i] = (basicUpper < upperBand[i - 1] || data[i - 1].close > upperBand[i - 1]) ? basicUpper : upperBand[i - 1];

                    if (trend[i - 1] === 1) {
                        trend[i] = data[i].close < lowerBand[i] ? -1 : 1;
                    } else {
                        trend[i] = data[i].close > upperBand[i] ? 1 : -1;
                    }

                    if (trend[i] !== trend[i - 1]) {
                        signals.push({
                            time: data[i].time,
                            type: trend[i] === 1 ? 'TBUY' : 'TSELL'
                        });
                    }
                }
            }
            return { signals };
        }

        function analyzeVSAData(candles, period = 20, factor = 1.8) {
            if (!candles || candles.length < period + 1) return { events: [], lastSupport: null, lastResistance: null, lastStats: null };
            let events = [], lastSupport = null, lastResistance = null;

            let totalVol = 0, totalBuy = 0, totalSell = 0;

            for (let i = period; i < candles.length; i++) {
                let sumVol = 0;
                for (let j = i - period; j < i; j++) sumVol += candles[j].volume;
                const avgVol = sumVol / period;
                const candle = candles[i];
                const range = candle.high - candle.low;
                const effVol = candle.volume || 1.0;
                const isWhale = effVol > (avgVol * factor);

                const volBuy = range === 0 ? effVol / 2 : effVol * ((candle.close - candle.low) / range);
                const volSell = effVol - volBuy;
                const deltaNet = volBuy - volSell;

                totalVol += effVol;
                totalBuy += volBuy;
                totalSell += volSell;

                const mInf = Math.min(candle.open, candle.close) - candle.low;
                const mSup = candle.high - Math.max(candle.open, candle.close);

                const isBuy = isWhale && (deltaNet > 0 || mInf > (range * 0.35));
                const isSell = isWhale && (deltaNet < 0 || mSup > (range * 0.35));

                if (isBuy) {
                    const ev = { index: i, time: candle.time, type: 'BUY', price: candle.low };
                    events.push(ev);
                    lastSupport = ev;
                } else if (isSell) {
                    const ev = { index: i, time: candle.time, type: 'SELL', price: candle.high };
                    events.push(ev);
                    lastResistance = ev;
                }
            }

            const pBuyVal = totalVol > 0 ? (totalBuy / totalVol) * 100 : 50;
            const pSellVal = totalVol > 0 ? (totalSell / totalVol) * 100 : 50;
            
            let signal = 'NEUTRAL';
            if (pBuyVal > 52) signal = 'BUY';
            else if (pSellVal > 52) signal = 'SELL';

            const pBuy = pBuyVal.toFixed(1) + "%";
            const pSell = pSellVal.toFixed(1) + "%";
            const volFormated = totalVol > 1000 ? (totalVol / 1000).toFixed(2) + "K" : totalVol.toFixed(2);

            return { 
                events, 
                lastSupport, 
                lastResistance, 
                lastStats: { signal, vol: volFormated, pBuy, pSell } 
            };
        }

        function drawOverlay() {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (!showVsa || vsaLinesToDraw.length === 0 || currentCandleData.length === 0) return;

            const timeScale = chart.timeScale();
            const lastCandle = currentCandleData[currentCandleData.length - 1];
            let candleX = timeScale.timeToCoordinate(lastCandle.time) || (overlay.width - 90);
            
            let labelOffsetX = candleX + 25; 

            let drawableItems = [];
            vsaLinesToDraw.forEach(item => {
                const y = candlestickSeries.priceToCoordinate(item.price);
                if (y !== null && y >= 0 && y <= overlay.height) {
                    let startX = 0;
                    if (item.startTime) {
                        const calculatedX = timeScale.timeToCoordinate(item.startTime);
                        if (calculatedX !== null) {
                            startX = Math.max(0, calculatedX);
                        }
                    }

                    drawableItems.push({
                        ...item,
                        originalY: y,
                        adjustedY: y,
                        startX: startX
                    });
                }
            });

            drawableItems.sort((a, b) => a.originalY - b.originalY);

            const minGap = 16; 
            for (let i = 1; i < drawableItems.length; i++) {
                let prev = drawableItems[i - 1];
                let curr = drawableItems[i];
                if (curr.adjustedY - prev.adjustedY < minGap) {
                    curr.adjustedY = prev.adjustedY + minGap;
                }
            }

            drawableItems.forEach(item => {
                ctx.save();
                ctx.strokeStyle = item.color;
                ctx.lineWidth = 1.5;
                if (item.dash && item.dash.length > 0) ctx.setLineDash(item.dash);

                ctx.beginPath();
                ctx.moveTo(item.startX, item.originalY);
                ctx.lineTo(labelOffsetX, item.originalY);
                if (item.originalY !== item.adjustedY) {
                    ctx.lineTo(labelOffsetX + 3, item.adjustedY);
                }
                ctx.stroke();
                ctx.restore();

                ctx.font = "bold 9px -apple-system, BlinkMacSystemFont, Roboto, sans-serif";
                const textWidth = ctx.measureText(item.title).width;
                const rectW = textWidth + 8;
                const rectH = 15;

                ctx.fillStyle = item.color;
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(labelOffsetX + 3, item.adjustedY - (rectH / 2), rectW, rectH, 3);
                } else {
                    ctx.rect(labelOffsetX + 3, item.adjustedY - (rectH / 2), rectW, rectH);
                }
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.title, labelOffsetX + 3 + (rectW / 2), item.adjustedY);
            });
        }

        async function fetchKlines(interval, limit = 200) {
            try {
                const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.map(d => ({
                    time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                }));
            } catch (err) {
                console.error("Error fetching klines:", err);
                return [];
            }
        }

        async function processIndicators() {
            if (!currentCandleData || currentCandleData.length === 0) return;
            let allMarkers = [];

            if (showSupertrend) {
                const st = calculateSupertrend(currentCandleData, 10, 3.0);
                st.signals.forEach(sig => {
                    allMarkers.push({
                        time: sig.time,
                        position: sig.type === 'TBUY' ? 'belowBar' : 'aboveBar',
                        color: sig.type === 'TBUY' ? '#089981' : '#f23645',
                        shape: sig.type === 'TBUY' ? 'arrowUp' : 'arrowDown',
                        text: sig.type
                    });
                });
            }

            if (showVsa) {
                const activeVsa = analyzeVSAData(currentCandleData);
                activeVsa.events.forEach(e => {
                    allMarkers.push({
                        time: e.time,
                        position: e.type === 'BUY' ? 'belowBar' : 'aboveBar',
                        color: e.type === 'BUY' ? '#2ea043' : '#f85149',
                        shape: 'circle',
                        text: 'BUY'
                    });
                });

                const activeTF = timeframeSelect.value;
                const mtfPromises = mtfTimeframes.map(cfg => 
                    (cfg.tf === activeTF) ? Promise.resolve(currentCandleData) : fetchKlines(cfg.tf, 150)
                );

                const mtfResults = await Promise.all(mtfPromises);
                let lines = [];

                mtfTimeframes.forEach((cfg, index) => {
                    const candles = mtfResults[index];
                    const { lastSupport, lastResistance, lastStats } = analyzeVSAData(candles);

                    const row = document.getElementById(`row-${cfg.tf}`);
                    if (row && lastStats) {
                        const cellSignal = row.cells[1];
                        if (lastStats.signal === 'BUY') {
                            cellSignal.innerHTML = '<span class="badge-buy">BUY</span>';
                        } else if (lastStats.signal === 'SELL') {
                            cellSignal.innerHTML = '<span class="badge-sell">SELL</span>';
                        } else {
                            cellSignal.innerHTML = '<span class="badge-neu">NEUTRAL</span>';
                        }
                        
                        row.cells[2].innerText = lastStats.vol;
                        row.cells[3].innerText = lastStats.pBuy;
                        row.cells[4].innerText = lastStats.pSell;
                    }

                    const isChartTF = cfg.tf === activeTF;
                    if (lastSupport) {
                        lines.push({ 
                            price: lastSupport.price, 
                            color: cfg.colorSop, 
                            title: isChartTF ? 'Sop Chart' : `Sop ${cfg.label}`, 
                            startTime: lastSupport.time,
                            dash: cfg.dash 
                        });
                    }
                    if (lastResistance) {
                        lines.push({ 
                            price: lastResistance.price, 
                            color: cfg.colorRes, 
                            title: isChartTF ? 'Res Chart' : `Res ${cfg.label}`, 
                            startTime: lastResistance.time,
                            dash: cfg.dash 
                        });
                    }
                });
                vsaLinesToDraw = lines;
            } else {
                vsaLinesToDraw = [];
            }

            candlestickSeries.setMarkers(allMarkers.sort((a, b) => a.time - b.time));
            drawOverlay();
        }

        function connectWebSocket(interval) {
            if (wsConnection) wsConnection.close();
            wsConnection = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);

            wsConnection.onmessage = (event) => {
                const k = JSON.parse(event.data).k;
                const candle = { time: Math.floor(k.t / 1000), open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v) };
                
                candlestickSeries.update(candle);
                if (currentCandleData.length > 0) {
                    if (currentCandleData[currentCandleData.length - 1].time === candle.time) {
                        currentCandleData[currentCandleData.length - 1] = candle;
                    } else {
                        currentCandleData.push(candle);
                        if (currentCandleData.length > 500) currentCandleData.shift();
                    }
                }
                processIndicators();
            };
        }

        async function renderChart() {
            const selectedTF = timeframeSelect.value;
            currentCandleData = await fetchKlines(selectedTF, 300);
            candlestickSeries.setData(currentCandleData);
            await processIndicators();
            connectWebSocket(selectedTF);
        }

        timeframeSelect.addEventListener('change', renderChart);
        
        document.getElementById("toggle-supertrend").addEventListener('click', function() {
            showSupertrend = !showSupertrend;
            this.classList.toggle('active', showSupertrend);
            this.classList.toggle('inactive', !showSupertrend);
            processIndicators();
        });

        document.getElementById("toggle-vsa").addEventListener('click', function() {
            showVsa = !showVsa;
            this.classList.toggle('active', showVsa);
            this.classList.toggle('inactive', !showVsa);
            processIndicators();
        });

        document.getElementById("toggle-dash").addEventListener('click', function() {
            showDash = !showDash;
            this.classList.toggle('active', showDash);
            this.classList.toggle('inactive', !showDash);
            dashboard.classList.toggle('collapsed', !showDash);
            
            setTimeout(() => {
                chart.applyOptions({ 
                    width: chartContainer.clientWidth, 
                    height: chartContainer.clientHeight 
                });
                resizeCanvas();
            }, 50);
        });

        renderChart();
    });
    </script>
</body>
</html>
